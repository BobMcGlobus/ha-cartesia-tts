[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RET", "C4", "D"]
ignore = [
  # The Home Assistant codebase does not use these pydocstyle rules either.
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
# Test names and fake objects document themselves; docstrings on every
# dunder and test function would be noise.
"tests/*" = ["D102", "D103", "D105", "D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
