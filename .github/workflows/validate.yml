name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The same invocation the Marketplace catalog (hacs/default) runs on a
      # new submission, so this job fails wherever that one would.
      - name: Run hassfest
        run: |
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/custom_components/cartesia_tts":/github/workspace/custom_components/cartesia_tts \
            ghcr.io/home-assistant/hassfest:latest | tee /tmp/hassfest.log
      # Hassfest only warns about custom integrations, but the catalog fails new
      # additions on brand-image warnings. Every warning is held to that bar, so
      # a submission never finds one first.
      - name: Fail on hassfest warnings
        run: |
          if grep -F "[WARNING]" /tmp/hassfest.log; then exit 1; fi

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No ignore key: the catalog runs this action without one and requires a
      # link to a run that passed the same way. Brand images now come from
      # custom_components/cartesia_tts/brand/ (Home Assistant 2026.3+).
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
      - run: ruff check .
      - run: ruff format --check .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aiohttp pytest
      # api.py carries no Home Assistant imports, so these run anywhere.
      - run: pytest tests/unit -q

  homeassistant:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.7 requires 3.14.2 or newer.
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: pytest tests -q

  homeassistant-latest:
    name: Import against latest Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # pytest-homeassistant-custom-component trails Home Assistant releases
      # and pins an older core, so the full suite cannot run against a new
      # release right away. Importing every module against the newest release
      # catches removed or renamed symbols in the meantime.
      - run: pip install homeassistant mutagen ha-ffmpeg
      - name: Import the integration
        run: |
          python - <<'PY'
          import importlib

          from homeassistant.const import __version__
          from homeassistant.helpers.device_registry import DeviceEntryType, DeviceInfo

          print("Home Assistant", __version__)
          for module in ("", ".api", ".config_flow", ".const", ".sensor", ".tts", ".usage"):
              importlib.import_module(f"custom_components.cartesia_tts{module}")
              print("imported", f"custom_components.cartesia_tts{module}")

          # DeviceInfo became a dataclass in 2026.11 and rejects unknown keyword
          # arguments; build it exactly the way tts.py and sensor.py do.
          DeviceInfo(
              identifiers={("cartesia_tts", "entry")},
              manufacturer="Cartesia",
              model="sonic-3.6",
              name="Cartesia",
              entry_type=DeviceEntryType.SERVICE,
          )
          print("DeviceInfo ok")
          PY
